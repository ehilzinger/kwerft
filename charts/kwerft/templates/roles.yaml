# Console roles as Kubernetes RBAC. The console impersonates each signed-in
# user as "kwerft:<email>" in the group "kwerft:role:<role>" (plus
# system:authenticated), so these bindings decide what every console user may
# do.
#
# Two layers (docs/phase4.md, "Project access"):
#  - Cluster-wide (the ClusterRoleBindings below): owners and admins reach
#    every kwerft.dev resource in every namespace. Developers and viewers
#    only read the cluster-scoped kwerft.dev kinds (projects, Git
#    connections, alert rules, notification channels, console settings,
#    firewall rules), and developers write alert rules. The console filters
#    the project list.
#  - Per project namespace: the Project reconciler binds
#    kwerft:project-developer, kwerft:project-viewer, kwerft:pods-read and
#    kwerft:pods-exec (internal/controllers/project_controller.go) to the
#    role groups (Project access Team, the default) or to the listed users
#    kwerft:<email> (access Members). Nothing namespaced (apps, builds,
#    pods, logs, ...) reaches a developer or viewer any other way.
#
# Nobody gets Secrets through this path. Developers can point an App at a
# Secret by name; the pod reads it, the user never does. Secret sets
# (Phase 6) add, per project namespace, the Roles the SecretSet reconciler
# keeps (internal/controllers/secretset_controller.go): kwerft:secret-sets,
# patch on exactly the Secrets of the project's sets, bound to owners,
# admins and the project's developers; kwerft:secret-sets-read, get on the
# same, bound to owners and admins (reveal, after their password).
#
# Keep template directives on lines of their own: the API tests apply this
# file to a test API server after dropping every line with a template action.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:owner
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [kwerft.dev]
    resources: ["*"]
    verbs: ["*"]
  # Clusters › Nodes: list nodes; drain, uncordon and remove them through
  # annotations the reconcilers act on (internal/server/api_nodes.go).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:admin
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [kwerft.dev]
    resources: ["*"]
    verbs: ["*"]
  # Clusters › Nodes: list nodes; drain, uncordon and remove them through
  # annotations the reconcilers act on (internal/server/api_nodes.go).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:developer
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  # Alert rules from Kwerft's built-in conditions. Custom expressions
  # (spec.expr) are owners' and admins': RBAC cannot see a field, so the
  # console refuses developers any write that creates, changes or deletes a
  # Custom rule, or a rule watching projects they do not reach
  # (internal/server/api_alerts.go). Users reach Kubernetes only through the
  # console.
  - apiGroups: [kwerft.dev]
    resources: [alertrules]
    verbs: [create, update, patch, delete]
  # The cluster-scoped kinds: read only. Git connections and notification
  # channels are owners' and admins' to write (kwerft.dev "*"). Never "*"
  # here: bound cluster-wide, a rule on "*" would reach every project's
  # namespaced objects too.
  - apiGroups: [kwerft.dev]
    resources: [projects, gitconnections, alertrules, notificationchannels, consolesettings, firewallrules]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:viewer
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [kwerft.dev]
    resources: [projects, gitconnections, alertrules, notificationchannels, consolesettings, firewallrules]
    verbs: [get, list, watch]
---
# A developer inside one project. Never bound cluster-wide: the Project
# reconciler binds it in each project namespace (Team: the group
# kwerft:role:developer; Members: each member with role developer).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:project-developer
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  # Workloads: deploy, change, roll back, restart, scale, delete; the
  # project's traffic rules; and its secret sets (key names in the status;
  # the values are in Secrets, which only the SecretSet reconciler's Roles
  # reach: kwerft:secret-sets, patch on exactly the managed ones).
  - apiGroups: [kwerft.dev]
    resources: [apps, domains, tasks, schedules, volumes, trafficrules, secretsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Builds: start one ("Build now") and cancel it (the cancel annotation is a
  # patch; the spec is immutable). No update, no delete: Kwerft prunes them.
  - apiGroups: [kwerft.dev]
    resources: [builds]
    verbs: [create, patch]
  # Everything else Kwerft keeps in a project (builds, ...):
  # read only. "*" is safe here: a RoleBinding confines it to the namespace.
  - apiGroups: [kwerft.dev]
    resources: ["*"]
    verbs: [get, list, watch]
---
# A viewer inside one project: read. Bound like kwerft:project-developer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:project-viewer
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [kwerft.dev]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwerft:owner
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwerft:owner
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:owner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwerft:admin
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwerft:admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwerft:developer
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwerft:developer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwerft:viewer
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwerft:viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:viewer
---
# Pods of a project: read them, their logs and their CPU/memory (metrics-server).
# Not bound cluster-wide: the Project reconciler binds it in each project
# namespace to the owner and admin groups and to whoever else reaches the
# project (Team: the developer and viewer groups; Members: every member), so
# no console role reaches the pods or logs of kube-system or kwerft-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:pods-read
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
# A shell in a project's containers (the console records every session).
# Bound per project namespace to owner, admin and developer (Team: the
# group; Members: members with role developer), never viewer.
# Exec over WebSocket is an HTTP GET, which Kubernetes authorizes as "get"
# and, for the upgrade, also as "create"; exec over SPDY is a POST ("create").
# Both verbs, so the console can use WebSocket and fall back to SPDY.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft:pods-exec
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  # Debug shells add a toolbox container to images without a shell.
  - apiGroups: [""]
    resources: [pods/ephemeralcontainers]
    verbs: [get, update, patch]
---
# Git connection credentials (Secrets git-<connection> in kwerft-builds)
# follow the DNS token's pattern below, but their names are only known at
# run time, so this chart does not hold their Role: the GitConnection
# reconciler keeps the Role and RoleBinding "kwerft:git-credentials" in
# kwerft-builds, granting owners and admins "patch" on exactly the Secrets of
# existing connections (resourceNames, never empty), and nothing else — no
# get, list or create. See internal/controllers/gitconnection_controller.go.
# Notification channel credentials (Secrets notify-<channel> in
# kwerft-observability) work the same way: the NotificationChannel
# reconciler keeps the Role and RoleBinding "kwerft:notify-secrets" there
# (internal/controllers/alerting_channels.go).
#
# Settings → apps domain with DNS-01: owners and admins store the DNS API
# token. "patch" on this one Secret only: no get, so not even they can read it
# back, and no create, because the Domain reconciler creates it empty. The
# console runs in kwerft-system (install.sh), next to the Gateway's objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kwerft:dns-token
  namespace: kwerft-system
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kwerft-dns-token]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwerft:dns-token
  namespace: kwerft-system
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwerft:dns-token
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:owner
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:admin
---
# Settings › Single sign-on: the OpenID Connect client secret, the same way
# as the DNS token (patch only; the Domain reconciler creates it empty; the
# console reads it with its own identity). Its settings are
# ConsoleSettings.spec.sso. The data key (kwerft-data-key) has no such role:
# a patch answers with the object, so even a patch right would reveal it;
# the console rotates it itself (internal/server/api_datakey.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kwerft:oidc-client
  namespace: kwerft-system
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kwerft-oidc-client]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwerft:oidc-client
  namespace: kwerft-system
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwerft:oidc-client
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:owner
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:admin
---
# Settings › Hetzner Cloud API: the Cloud API token, the same way as the DNS
# token (patch only; the Domain reconciler creates it empty; Kwerft's own
# identity reads it for the Cloud Firewall and the Load Balancer, and copies
# it to the CSI driver's Secret kube-system/hcloud). What Kwerft does with it
# is ConsoleSettings.spec.hetznerCloud.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kwerft:hcloud-token
  namespace: kwerft-system
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kwerft-hcloud-token]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwerft:hcloud-token
  namespace: kwerft-system
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwerft:hcloud-token
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:owner
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kwerft:role:admin
