{{- if .Values.diskHealth.enabled }}
# Disk health on dedicated servers: smartctl_exporter reads every disk's
# SMART data (NVMe health log, ATA/SCSI status) and exports it for the
# alerts DiskFailing, DiskWearing and DiskReadingsMissing and for
# Clusters › Nodes; RAID (md) state comes from the stack's node-exporter
# (RAIDDegraded). Only nodes the installer labelled
# kwerft.dev/platform=dedicated: Cloud servers' virtual disks have no SMART
# data. Root and privileged, because smartctl opens the host's /dev/nvme*
# and /dev/sd* and sends admin commands; it has no Service account token,
# no host network, and only vmagent (and the kubelet) may reach its port.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kwerft-disk-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kwerft.labels" . | nindent 4 }}
    app.kubernetes.io/component: disk-health
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kwerft-disk-health
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwerft-disk-health
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: disk-health
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kwerft.dev/platform: dedicated
      # Every dedicated node, including tainted control-plane nodes.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 5
      containers:
        - name: smartctl
          image: "{{ .Values.diskHealth.image.repository }}:{{ .Values.diskHealth.image.tag }}"
          imagePullPolicy: {{ .Values.diskHealth.image.pullPolicy }}
          # Reads every disk once per interval in the background; a scrape
          # returns the last readings and never wakes a disk itself.
          args:
            - --web.listen-address=:{{ .Values.diskHealth.port }}
            - --smartctl.interval={{ .Values.diskHealth.interval }}
            - --smartctl.rescan=10m
          ports:
            - name: metrics
              containerPort: {{ .Values.diskHealth.port }}
              protocol: TCP
          resources: {{- toYaml .Values.diskHealth.resources | nindent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
{{- if .Values.metrics.enabled }}
---
# Only vmagent scrapes the exporter (disk models and serial numbers are no
# business of app pods), and the nodes for the kubelet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kwerft-disk-health
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kwerft-disk-health
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.metrics.vmagentNamespace }}
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: {{ .Values.diskHealth.port | quote }}, protocol: TCP }]
    - fromEntities: [host]
{{- if .Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1" }}
---
# Every series gets the label node (the pod's node) and the job
# kwerft-disk-health, which the alert rules and the console select on
# (internal/observability). Only the series Kwerft reads are kept: a disk's
# identity, its SMART status, the NVMe critical warning, media errors,
# percentage used, available spare and its threshold, smartctl's exit
# status per disk and the number of disks found.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: kwerft-disk-health
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kwerft-disk-health
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - targetLabel: job
          replacement: kwerft-disk-health
      metricRelabelConfigs:
        - sourceLabels: [__name__]
          regex: smartctl_device|smartctl_devices|smartctl_device_(smart_status|critical_warning|media_errors|percentage_used|available_spare|available_spare_threshold|smartctl_exit_status)
          action: keep
        # The identity series: device, model and serial number, interface.
        - regex: ata_additional_product_id|ata_version|firmware_version|form_factor|model_family|protocol|sata_version|scsi_.*
          action: labeldrop
{{- end }}
{{- end }}
{{- end }}
