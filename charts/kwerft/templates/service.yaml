apiVersion: v1
kind: Service
metadata:
  name: {{ include "kwerft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  selector: {{- include "kwerft.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
