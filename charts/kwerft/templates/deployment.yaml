{{- $agent := eq .Values.mode "agent" }}
{{- if not (has .Values.mode (list "console" "agent")) }}
{{- fail "mode must be console or agent" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kwerft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  # TODO(phase-1): replicas > 1 needs leader election for the reconcilers and
  # the SQLite store moved behind the leader (or to Postgres for HA).
  replicas: 1
  strategy:
    type: Recreate             # single RWO volume for SQLite
  selector:
    matchLabels: {{- include "kwerft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kwerft.selectorLabels" . | nindent 8 }}
      {{- if not $agent }}
      # Backups (docs/phase6.md): before Velero copies the data volume, a
      # consistent copy of the database goes to backup/kwerft.db on it; a
      # failed copy fails the backup of this pod rather than carrying a
      # database that may be torn. install.sh --restore swaps the copy in.
      annotations:
        pre.hook.backup.velero.io/container: kwerft
        pre.hook.backup.velero.io/command: '["/usr/local/bin/kwerft", "db-snapshot", "--data-dir=/var/lib/kwerft"]'
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 2m
      {{- end }}
    spec:
      serviceAccountName: {{ include "kwerft.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kwerft
          image: {{ include "kwerft.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if $agent }}
            # Agent mode (docs/phase5.md): the reconcilers, and a tunnel to
            # the console instead of the console itself.
            - agent
            - --console-url={{ required "agent.consoleURL is required in agent mode" .Values.agent.consoleURL }}
            - --agent-token-file=/etc/kwerft-agent/token
            {{- end }}
            - --listen=:8080
            {{- if not $agent }}
            - --data-dir=/var/lib/kwerft
            - --console-domain={{ required "console.domain is required" .Values.console.domain }}
            {{- end }}
            - --platform={{ .Values.platform }}
            - --gateway-class={{ .Values.gateway.className }}
            - --cluster-issuer={{ if .Values.acme.enabled }}letsencrypt{{ end }}
            - --metrics-listen={{ if .Values.metrics.enabled }}:{{ .Values.metrics.port }}{{ else }}0{{ end }}
            - --hubble-relay={{ if .Values.hubble.enabled }}{{ .Values.hubble.relayAddress }}{{ end }}
            {{- with .Values.firewall.privateNetwork }}
            - --private-network={{ . }}
            {{- end }}
            {{- with .Values.hcloud }}
            - --hcloud-ccm={{ .ccm }}
            {{- with .proxyNetwork }}
            - --hcloud-proxy-network={{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.builds }}
            {{- if .enabled }}
            - --buildkit-image={{ required "builds.buildkitImage is required" .buildkitImage }}
            - --railpack-image={{ required "builds.railpackImage is required" .railpackImage }}
            - --max-concurrent-builds={{ .maxConcurrent }}
            - --build-timeout={{ .timeout }}
            - --build-apparmor-profile={{ .appArmorProfile }}
            {{- end }}
            {{- end }}
            {{- with .Values.upgrades.installBaseURL }}
            - --install-base-url={{ . }}
            {{- end }}
            {{- if .Values.e2e.faults }}
            - --upgrade-faults
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # Its own pod: the image the upgrade runner is pinned to.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- if not $agent }}
            - name: KWERFT_DATA_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kwerft.fullname" . }}-data-key, key: key } }
            # Set only while a data-key rotation is unfinished (docs/plan.md).
            - name: KWERFT_DATA_KEY_PREVIOUS
              valueFrom: { secretKeyRef: { name: {{ include "kwerft.fullname" . }}-data-key, key: previous, optional: true } }
            - name: KWERFT_DATA_KEY_SECRET
              value: {{ include "kwerft.fullname" . }}-data-key
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- if $agent }}
            # Read before every dial, so a rotated token needs no restart.
            - name: agent-token
              mountPath: /etc/kwerft-agent
              readOnly: true
            {{- else }}
            - name: data
              mountPath: /var/lib/kwerft
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if $agent }}
        - name: agent-token
          secret:
            secretName: {{ .Values.agent.tokenSecret }}
            items: [{ key: token, path: token }]
        {{- else }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kwerft.fullname" . }}-data
        {{- end }}
        - name: tmp
          emptyDir: {}
