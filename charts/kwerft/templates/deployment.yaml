apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kwerft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  # TODO(phase-1): replicas > 1 needs leader election for the reconcilers and
  # the SQLite store moved behind the leader (or to Postgres for HA).
  replicas: 1
  strategy:
    type: Recreate             # single RWO volume for SQLite
  selector:
    matchLabels: {{- include "kwerft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kwerft.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kwerft.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kwerft
          image: {{ include "kwerft.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:8080
            - --data-dir=/var/lib/kwerft
            - --console-domain={{ required "console.domain is required" .Values.console.domain }}
            - --platform={{ .Values.platform }}
            - --gateway-class={{ .Values.gateway.className }}
            - --cluster-issuer={{ if .Values.acme.enabled }}letsencrypt{{ end }}
            - --metrics-listen={{ if .Values.metrics.enabled }}:{{ .Values.metrics.port }}{{ else }}0{{ end }}
            {{- with .Values.firewall.privateNetwork }}
            - --private-network={{ . }}
            {{- end }}
            {{- with .Values.builds }}
            {{- if .enabled }}
            - --buildkit-image={{ required "builds.buildkitImage is required" .buildkitImage }}
            - --railpack-image={{ required "builds.railpackImage is required" .railpackImage }}
            - --max-concurrent-builds={{ .maxConcurrent }}
            - --build-timeout={{ .timeout }}
            - --build-apparmor-profile={{ .appArmorProfile }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: KWERFT_DATA_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kwerft.fullname" . }}-data-key, key: key } }
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kwerft
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kwerft.fullname" . }}-data
        - name: tmp
          emptyDir: {}
