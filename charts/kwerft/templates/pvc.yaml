{{- /* SQLite: the console's only; agents keep no state of their own. */ -}}
{{- if ne .Values.mode "agent" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kwerft.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
