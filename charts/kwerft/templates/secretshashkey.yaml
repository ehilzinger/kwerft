{{- /*
The secrets hash key keys the hash of secret values that the App reconciler
puts on pod templates (kwerft.dev/secrets-hash), so a changed value rolls the
App. Pod templates are readable by every role, viewers included; without a
key a viewer could confirm a guessed value offline.

Like the data key it is generated on the first install, looked up on every
upgrade and kept on uninstall, so hashes stay the same and Apps do not roll.
Unlike the data key it is never rotated (a new key rolls every App that
references secrets once) and agents have one too: they run the App
reconciler. Losing it costs nothing but that one rollout.
*/ -}}
{{- $name := printf "%s-secrets-hash-key" (include "kwerft.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ dig "data" "key" (randBytes 32 | b64enc) $existing }}
