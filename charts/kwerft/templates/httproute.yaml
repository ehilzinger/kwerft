apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kwerft.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: kwerft  # the Gateway Kwerft manages
      sectionName: console-https
  hostnames: [{{ .Values.console.domain | quote }}]
  rules:
    - backendRefs:
        - name: {{ include "kwerft.fullname" . }}
          port: 80
---
# Plain HTTP on the console hostname only redirects to HTTPS. ACME HTTP-01
# challenges use their own, more specific routes created by cert-manager.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kwerft.fullname" . }}-console-redirect
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: kwerft
      sectionName: http
  hostnames: [{{ .Values.console.domain | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
