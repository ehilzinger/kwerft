# Kwerft acts on behalf of signed-in users through impersonation, so Kubernetes
# RBAC stays the final authority. Its own service account needs:
#  - impersonate: to forward user requests with the user's identity
#  - full access to kwerft.dev resources: the reconcilers own them
#  - the objects the reconcilers render (TODO(phase-1): narrow to exact verbs)
# In agent mode (a remote cluster, docs/phase5.md) the same service account and
# role serve the agent: the console's requests through its tunnel reach this
# cluster with exactly these rights, user requests impersonated as locally.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwerft-controller
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [users, serviceaccounts]
    verbs: [impersonate]
  # Only the groups the console hands out (see roles.yaml), never system:masters.
  - apiGroups: [""]
    resources: [groups]
    verbs: [impersonate]
    resourceNames: ["kwerft:role:owner", "kwerft:role:admin", "kwerft:role:developer", "kwerft:role:viewer", "system:authenticated"]
  - apiGroups: [kwerft.dev]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [namespaces, services, secrets, configmaps, persistentvolumeclaims, resourcequotas, limitranges, pods, pods/log, events, nodes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Draining nodes (node pools, "remove node"): evictions respect
  # PodDisruptionBudgets; local volumes pinned to a node hold its removal.
  # Join material: k3s bootstrap tokens are Secrets in kube-system (above).
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # The apps wildcard: a DNS-01 Issuer and Certificate of Kwerft's own, and
  # retrying a failed one at once after the DNS token changed (status).
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificates/status, issuers, clusterissuers]
    verbs: [get, list, watch, create, update, patch, delete]
  # Alerting (kwerft-observability): the VMRule "kwerft-alerts" and one
  # VMAlertmanagerConfig per notification channel; VMAlertmanagers are only
  # read (is the namespace matcher off?). The channels' Secrets are covered
  # by the core rule above.
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmrules, vmalertmanagerconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmalertmanagers]
    verbs: [get, list, watch]
  # Backups (namespace velero): the BackupStorageLocation, Schedules from
  # BackupPlans, Backups for "Back up now", Restores, and DownloadRequests
  # for a backup's contents (a restore under a new name copies the
  # project's spec from there). The credentials Secrets there and the k3s
  # etcd snapshot S3 Secret in kube-system are covered by the core rule.
  - apiGroups: [velero.io]
    resources: [backupstoragelocations, schedules, backups, restores, downloadrequests]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [velero.io]
    resources: [podvolumebackups]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # The nodes' Cilium router IPs: Traefik's connections come from them, so
  # only they may set X-Real-Ip (internal/server/clientip.go).
  - apiGroups: [cilium.io]
    resources: [ciliumnodes]
    verbs: [get, list, watch]
  # Whether the hcloud CSI driver's StorageClass hcloud-volumes exists: the
  # Volumes page offers Cloud Volumes only then.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
  # The Project reconciler binds these in each project namespace (see
  # roles.yaml). "bind" because the console does not itself hold everything
  # they grant (metrics.k8s.io).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: ["kwerft:pods-read", "kwerft:pods-exec", "kwerft:project-developer", "kwerft:project-viewer"]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  # Kubernetes (k3s) upgrades (docs/phase6-upgrades.md): the
  # system-upgrade-controller Plans in system-upgrade (its Jobs and pods
  # are read through the core and batch rules above); verification reads
  # Cilium's and Traefik's DaemonSets and the Gateway API CRDs; the
  # preflight asks the API server about etcd and deprecated APIs in use.
  - apiGroups: [upgrade.cattle.io]
    resources: [plans]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /readyz/etcd]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwerft-controller
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwerft-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "kwerft.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# The cluster's metrics, logs and Alertmanager through the API server's
# service proxy: how the console reaches a remote cluster's observability
# stack through the agent tunnel (docs/phase5.md, W4), and the same right
# locally so both identities stay equal. Only this namespace; the console
# confines queries to the user's projects itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kwerft-observability-proxy
  namespace: {{ .Values.observability.namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwerft-observability-proxy
  namespace: {{ .Values.observability.namespace }}
  labels: {{- include "kwerft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwerft-observability-proxy
subjects:
  - kind: ServiceAccount
    name: {{ include "kwerft.fullname" . }}
    namespace: {{ .Release.Namespace }}
