---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: volumes.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: Volume
    listKind: VolumeList
    plural: volumes
    shortNames:
    - vol
    singular: volume
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Volume is a persistent disk in a project that Apps and Tasks
          share.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VolumeSpec is a disk that Apps and Tasks in the same project mount by name
              (AppVolume.volume), e.g. a job writes a file that a server then reads.

              The disk is ReadWriteOnce: every pod that mounts it runs on the same node.
              local-nvme volumes are pinned to the node they were created on; for
              hcloud-volume, pods that share a Volume prefer the node it is attached to.
            properties:
              class:
                default: local-nvme
                description: |-
                  Class is local-nvme (fastest, pinned to one node) or hcloud-volume
                  (movable between Hetzner Cloud nodes).
                enum:
                - local-nvme
                - hcloud-volume
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Size of the disk. Growing it works for hcloud-volume; local-nvme
                  volumes cannot be resized.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: size must be positive
                  rule: quantity(string(self)).isGreaterThan(quantity('0'))
            required:
            - size
            type: object
            x-kubernetes-validations:
            - message: class cannot be changed; create a new Volume
              rule: self.class == oldSelf.class
            - message: size can only grow
              rule: quantity(string(self.size)).compareTo(quantity(string(oldSelf.size)))
                >= 0
          status:
            description: VolumeStatus is written by the Volume reconciler.
            properties:
              capacity:
                anyOf:
                - type: integer
                - type: string
                description: Capacity actually provisioned; can be larger than spec.size.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              claimName:
                description: ClaimName is the PersistentVolumeClaim behind this Volume.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase of the claim: Pending (local-nvme binds when the first pod
                  mounts it), Bound or Lost.
                type: string
              usedBy:
                description: |-
                  UsedBy lists the Apps, Schedules and unfinished Tasks that mount this
                  Volume, as "App/api" or "Task/import-1". While it is not empty, deleting
                  the Volume waits (the volume-protection finalizer).
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
