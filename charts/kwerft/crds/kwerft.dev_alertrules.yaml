---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: alertrules.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: AlertRule
    listKind: AlertRuleList
    plural: alertrules
    shortNames:
    - alert
    singular: alertrule
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.condition
      name: Condition
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AlertRule is an alert Kwerft evaluates (vmalert) and routes to
          notification channels (Alertmanager). Cluster-scoped: owners and admins
          manage rules for every project. Kwerft creates a default set labelled
          kwerft.dev/default=true, which can be changed or disabled but comes back
          if deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AlertRuleSpec is one alert: a condition, where it applies, how bad it is
              and who hears about it.
            properties:
              channels:
                description: |-
                  Channels are NotificationChannel names. Empty: the alert only shows in
                  the console.
                items:
                  type: string
                type: array
              condition:
                description: AlertCondition is a condition Kwerft knows how to measure
                  and explain.
                enum:
                - CrashLooping
                - Restarts
                - MemoryHigh
                - CPUHigh
                - VolumeFillingUp
                - NodeMemoryPressure
                - NodeDiskPressure
                - CertificateExpiring
                - ScheduleFailing
                - BuildFailing
                - HTTPErrorRate
                - HTTPLatency
                - Custom
                type: string
              disabled:
                description: Disabled rules are kept but not evaluated.
                type: boolean
              expr:
                description: |-
                  Expr is a MetricsQL expression for Custom rules; each result series is
                  one alert.
                maxLength: 4096
                type: string
              for:
                description: For is how long the condition must hold before the alert
                  fires.
                type: string
              scope:
                description: |-
                  AlertScope narrows what a rule watches. Empty: everything the condition
                  applies to (all projects, all nodes, all certificates).
                properties:
                  apps:
                    description: Apps to watch, as "<project>/<app>".
                    items:
                      type: string
                    type: array
                  projects:
                    description: Projects (namespaces) to watch.
                    items:
                      type: string
                    type: array
                type: object
              severity:
                default: warning
                description: AlertSeverity orders alerts and picks their color.
                enum:
                - critical
                - warning
                - info
                type: string
              threshold:
                description: |-
                  Threshold of the condition: a count (Restarts), percent (MemoryHigh,
                  CPUHigh, VolumeFillingUp, Node*, HTTPErrorRate) or milliseconds
                  (HTTPLatency). Empty: the condition's default.
                format: int64
                type: integer
              window:
                description: |-
                  Window the condition looks at (Restarts, VolumeFillingUp prediction,
                  CertificateExpiring, ScheduleFailing, HTTP*). Empty: the default.
                type: string
            required:
            - condition
            type: object
            x-kubernetes-validations:
            - message: a Custom rule needs expr
              rule: self.condition != 'Custom' || (has(self.expr) && size(self.expr)
                > 0)
            - message: expr is only for Custom rules
              rule: self.condition == 'Custom' || !has(self.expr)
          status:
            description: AlertRuleStatus is written by the alerting reconciler.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expr:
                description: Expr is the expression Kwerft evaluates for this rule,
                  for reference.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
