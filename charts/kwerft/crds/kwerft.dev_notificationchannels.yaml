---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: notificationchannels.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: NotificationChannel
    listKind: NotificationChannelList
    plural: notificationchannels
    shortNames:
    - notify
    singular: notificationchannel
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NotificationChannel is a destination for alerts. Cluster-scoped, managed
          by owners and admins.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NotificationChannelSpec is one place alerts go. Secrets (webhook URLs,
              passwords, tokens) live in the Secret "notify-<name>" in
              kwerft-observability, written by owners and admins through the console and
              read back by nobody.
            properties:
              email:
                description: 'EmailSettings: SMTP. The password is secret (key "password").'
                properties:
                  from:
                    minLength: 1
                    type: string
                  smtpHost:
                    description: SMTPHost is host:port, e.g. smtp.example.com:587
                      (STARTTLS required).
                    minLength: 1
                    type: string
                  to:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  username:
                    type: string
                required:
                - from
                - smtpHost
                - to
                type: object
              ntfy:
                description: 'NtfySettings: an optional access token is secret (key
                  "token").'
                properties:
                  server:
                    default: https://ntfy.sh
                    pattern: ^https://
                    type: string
                  topic:
                    minLength: 1
                    type: string
                required:
                - topic
                type: object
              sendResolved:
                default: true
                description: SendResolved also notifies when an alert stops firing.
                type: boolean
              slack:
                description: 'SlackSettings: the incoming-webhook URL is secret (key
                  "url").'
                properties:
                  channel:
                    description: 'Channel to post to, e.g. #ops-alerts; empty uses
                      the webhook''s default.'
                    type: string
                type: object
              type:
                description: NotificationType is how a channel delivers.
                enum:
                - slack
                - email
                - webhook
                - ntfy
                type: string
              webhook:
                description: 'WebhookSettings: the URL is secret (key "url"), as it
                  often carries a token.'
                type: object
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: set exactly the settings of the channel's type
              rule: (self.type == 'slack') == has(self.slack) && (self.type == 'email')
                == has(self.email) && (self.type == 'webhook') == has(self.webhook)
                && (self.type == 'ntfy') == has(self.ntfy)
          status:
            description: NotificationChannelStatus is written by the alerting reconciler.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastTest:
                description: LastTest is when the console last sent a test notification,
                  and how it went.
                format: date-time
                type: string
              lastTestError:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
