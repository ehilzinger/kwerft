---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: secretsets.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: SecretSet
    listKind: SecretSetList
    plural: secretsets
    shortNames:
    - sset
    singular: secretset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecretSet holds a project's secret values, shared by its Apps, Tasks and
          Schedules, or one App's own (<app>-env, owned by the App).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SecretSetSpec is a named group of secret values in a project (docs/plan.md
              › Secrets). The values live in the Secret of the same name, labelled
              kwerft.dev/secret-set, which the API writes as the user; the spec holds
              no values.
            properties:
              derived:
                description: |-
                  Derived keys are computed from other keys of the set by the
                  reconciler, e.g. DATABASE_URL from PASSWORD.
                items:
                  description: |-
                    DerivedSecretKey is a value built from a template with ${KEY} references
                    to the set's other keys, e.g.
                    postgres://app:${PASSWORD}@postgres-main:5432/app.
                  properties:
                    key:
                      pattern: ^[-._a-zA-Z0-9]{1,253}$
                      type: string
                    template:
                      maxLength: 2048
                      type: string
                  required:
                  - key
                  - template
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              description:
                maxLength: 200
                type: string
              generate:
                description: |-
                  Generate lists keys the reconciler fills with 32 random bytes
                  (base64url) while they are missing, e.g. a database password from a
                  template. Removing a key here keeps its value.
                items:
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: set
            type: object
          status:
            description: |-
              SecretSetStatus is written by the SecretSet reconciler with the
              controller's own permissions, so developers and viewers learn key names
              without reading the Secret.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              keys:
                items:
                  description: SecretKeyStatus describes one key, never its value.
                  properties:
                    name:
                      type: string
                    source:
                      description: 'Source: Set, Generated or Derived.'
                      type: string
                    updatedAt:
                      format: date-time
                      type: string
                    updatedBy:
                      description: |-
                        UpdatedBy is the console user who last set it; empty for generated
                        and derived keys.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              missing:
                description: |-
                  Missing lists references to keys the set does not have, as
                  "App/api: SMTP_PASSWORD".
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              usedBy:
                description: |-
                  UsedBy lists the Apps, Tasks and Schedules that reference this set,
                  as "App/api".
                items:
                  type: string
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
