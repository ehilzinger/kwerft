---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: trafficrules.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: TrafficRule
    listKind: TrafficRuleList
    plural: trafficrules
    shortNames:
    - traffic
    singular: trafficrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TrafficRule allows network traffic in the project it lives in
          (namespaced).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TrafficRuleSpec allows traffic between apps, projects and the outside, on
              top of the project's default (isolated projects deny all ingress from
              other projects; Apps open their own ports to the ingress and their
              project).
            properties:
              description:
                maxLength: 256
                type: string
              disabled:
                description: Disabled rules are kept but not applied.
                type: boolean
              from:
                description: |-
                  From are the sources. For an ingress rule (To empty or apps of this
                  project) they may be anything; Internet means through the ingress.
                items:
                  description: TrafficPeer is one side of a TrafficRule. Exactly one
                    field is set.
                  properties:
                    app:
                      description: App in this rule's project, or "<project>/<app>"
                        in another.
                      maxLength: 127
                      type: string
                    cidr:
                      description: CIDR outside the cluster, e.g. 10.0.0.0/16 (a Hetzner
                        private network).
                      maxLength: 43
                      type: string
                    internet:
                      description: |-
                        Internet: traffic from outside the cluster through the ingress
                        (sources), or to public addresses (destinations).
                      type: boolean
                    project:
                      description: 'Project: every app of that project.'
                      maxLength: 63
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of app, project, internet or cidr
                    rule: '(has(self.app) ? 1 : 0) + (has(self.project) ? 1 : 0) +
                      (has(self.internet) && self.internet ? 1 : 0) + (has(self.cidr)
                      ? 1 : 0) == 1'
                maxItems: 32
                minItems: 1
                type: array
              ports:
                description: Ports; empty means every port.
                items:
                  description: TrafficPort is a port and protocol a rule allows.
                  properties:
                    endPort:
                      format: int32
                      type: integer
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: TCP
                      enum:
                      - TCP
                      - UDP
                      type: string
                  required:
                  - port
                  type: object
                maxItems: 32
                type: array
              to:
                description: |-
                  To are the destinations. Apps of this rule's project receive (ingress);
                  Internet, CIDR or other projects' apps are reached by From, which
                  must then be apps of this project (egress).
                items:
                  description: TrafficPeer is one side of a TrafficRule. Exactly one
                    field is set.
                  properties:
                    app:
                      description: App in this rule's project, or "<project>/<app>"
                        in another.
                      maxLength: 127
                      type: string
                    cidr:
                      description: CIDR outside the cluster, e.g. 10.0.0.0/16 (a Hetzner
                        private network).
                      maxLength: 43
                      type: string
                    internet:
                      description: |-
                        Internet: traffic from outside the cluster through the ingress
                        (sources), or to public addresses (destinations).
                      type: boolean
                    project:
                      description: 'Project: every app of that project.'
                      maxLength: 63
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of app, project, internet or cidr
                    rule: '(has(self.app) ? 1 : 0) + (has(self.project) ? 1 : 0) +
                      (has(self.internet) && self.internet ? 1 : 0) + (has(self.cidr)
                      ? 1 : 0) == 1'
                maxItems: 32
                minItems: 1
                type: array
            required:
            - from
            - to
            type: object
          status:
            description: TrafficRuleStatus is written by the TrafficRule reconciler.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              counts:
                description: TrafficCounts are Hubble's flow counts for a rule over
                  the last hour.
                properties:
                  allowed:
                    format: int64
                    type: integer
                  dropped:
                    format: int64
                    type: integer
                  since:
                    format: date-time
                    type: string
                required:
                - allowed
                - dropped
                type: object
              observedGeneration:
                format: int64
                type: integer
              policies:
                description: Policies are the CiliumNetworkPolicies the rule became.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
