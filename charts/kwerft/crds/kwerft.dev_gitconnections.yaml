---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gitconnections.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: GitConnection
    listKind: GitConnectionList
    plural: gitconnections
    shortNames:
    - gitconn
    singular: gitconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.auth
      name: Auth
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GitConnection grants access to repositories on a Git host. Apps with a
          Git source name it in spec.source.git.connection. Cluster-scoped: owners
          and admins manage connections for every project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GitConnectionSpec is access to repositories on one Git host. Credentials
              live in the Secret "git-<name>" in the kwerft-builds namespace (keys:
              token, ssh-privatekey, known_hosts, github-app-private-key,
              webhook-secret), which owners and admins may write through the console
              but nobody reads back.
            properties:
              auth:
                description: GitAuth is how Kwerft authenticates to the host.
                enum:
                - none
                - token
                - sshKey
                - githubApp
                type: string
              githubApp:
                description: |-
                  GitHubAppSettings identifies a GitHub App installation. Its private key
                  lives in the connection's credentials Secret.
                properties:
                  appID:
                    format: int64
                    type: integer
                  installationID:
                    format: int64
                    type: integer
                  slug:
                    description: Slug is the app's URL name, for links to its settings.
                    type: string
                required:
                - appID
                - installationID
                type: object
              owner:
                description: |-
                  Owner limits the connection to one account, organisation or group,
                  e.g. "acme". Empty: whatever the credentials reach.
                type: string
              projects:
                description: Projects that may build with this connection; empty means
                  all.
                items:
                  type: string
                type: array
              provider:
                description: GitProvider is the kind of Git host.
                enum:
                - github
                - gitlab
                - gitea
                - generic
                type: string
              url:
                description: URL of the host, e.g. https://github.com or https://gitlab.example.com.
                pattern: ^https://[^/\s]+(/[^\s]*)?$
                type: string
            required:
            - auth
            - provider
            - url
            type: object
            x-kubernetes-validations:
            - message: auth githubApp needs provider github and githubApp
              rule: self.auth != 'githubApp' || (self.provider == 'github' && has(self.githubApp))
          status:
            description: GitConnectionStatus is written by the GitConnection reconciler.
            properties:
              account:
                description: Account the credentials act as (user, bot or app installation).
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastDelivery:
                description: LastDelivery is when the last valid webhook arrived.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              webhookURL:
                description: WebhookURL receives the host's push and pull-request
                  events.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
