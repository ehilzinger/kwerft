---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: consolesettings.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: ConsoleSettings
    listKind: ConsoleSettingsList
    plural: consolesettings
    shortNames:
    - kwset
    singular: consolesettings
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.consoleDomain
      name: Console
      type: string
    - jsonPath: .spec.appsDomain
      name: Apps
      type: string
    - jsonPath: .spec.tls
      name: TLS
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConsoleSettings holds the console's own configuration that reconcilers
          need: its hostname, the apps base domain and how certificates are issued.
          It is a singleton named "kwerft".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConsoleSettingsSpec is what owners and admins choose on the Settings page
              (or the installer from --domain and --config).
            properties:
              appsDomain:
                description: |-
                  AppsDomain is the base domain for apps, e.g. apps.example.com. The
                  deploy wizard suggests <app>.<appsDomain>. With tls dns01, hostnames
                  one label below it share a wildcard listener and certificate.
                maxLength: 200
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]([-a-z0-9]*[a-z0-9])?$
                type: string
              backups:
                description: |-
                  Backups is where backups go (docs/phase6.md). The bucket's access
                  keys live in the Secret kwerft-backup-credentials and the recovery
                  key in kwerft-backup-key (kwerft-system), which owners and admins may
                  write but nobody reads back.
                properties:
                  bucket:
                    maxLength: 63
                    minLength: 3
                    type: string
                  endpoint:
                    description: Endpoint, e.g. https://fsn1.your-objectstorage.com.
                    pattern: ^https://[^/\s]+/?$
                    type: string
                  etcdSnapshots:
                    description: |-
                      EtcdSnapshots: k3s's own snapshots of the cluster state, which k3s
                      keeps locally (every 6 hours, 28 kept, unless set here). Set, Kwerft's
                      node agent also uploads them to the same bucket (folder
                      <prefix>/etcd/<node>), encrypted with the SSE-C key derived from the
                      recovery key, and keeps the same number there; nil keeps them local
                      only. The installer applies a changed schedule on its next run (k3s
                      reads it only when it starts).
                    properties:
                      retention:
                        description: 'Retention: how many snapshots to keep (default
                          28).'
                        format: int32
                        maximum: 500
                        minimum: 1
                        type: integer
                      schedule:
                        description: Schedule in cron syntax (default every 6 hours).
                        type: string
                    type: object
                  prefix:
                    description: |-
                      Prefix inside the bucket, so several consoles can share one
                      (default: the console's hostname).
                    maxLength: 200
                    type: string
                  region:
                    description: Region, e.g. fsn1.
                    type: string
                required:
                - bucket
                - endpoint
                type: object
              consoleDomain:
                description: |-
                  ConsoleDomain is the console's hostname. Empty falls back to the
                  --console-domain flag the installer passed. Changing it adds a listener
                  for the new name; the console moves there once its certificate is
                  issued (status.consoleDomain).
                maxLength: 253
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]([-a-z0-9]*[a-z0-9])?$
                type: string
              dns:
                description: |-
                  DNS is the provider for tls dns01 and for managed records. Its API
                  token lives in the Secret kwerft-dns-token (key "token") in
                  kwerft-system, which owners and admins may write through the console
                  but nobody reads back.
                properties:
                  manageRecords:
                    description: |-
                      ManageRecords makes Kwerft keep A and AAAA records for the console
                      hostname and *.<appsDomain> pointing at the nodes' public addresses
                      (status.publicAddresses). It labels the records it creates and never
                      changes records it did not create. Turning it off leaves the records
                      in place.
                    type: boolean
                  provider:
                    description: |-
                      Provider of the zones. Only Hetzner (DNS in the Hetzner Console, Cloud
                      API) for now. It solves DNS-01 challenges for tls dns01.
                    enum:
                    - hetzner
                    type: string
                required:
                - provider
                type: object
              hetznerCloud:
                description: |-
                  HetznerCloud is what Kwerft does with the Hetzner Cloud API: the
                  Cloud Firewall and a Load Balancer in front of the ingress. Its API
                  token lives in the Secret kwerft-hcloud-token (key "token") in
                  kwerft-system, which owners and admins may write through the console
                  but nobody reads back.
                properties:
                  firewall:
                    description: 'Firewall: sync (default) or off.'
                    enum:
                    - sync
                    - "off"
                    type: string
                  loadBalancer:
                    description: LoadBalancer puts a Hetzner Load Balancer in front
                      of the ingress.
                    properties:
                      enabled:
                        type: boolean
                      location:
                        description: |-
                          Location, e.g. fsn1; empty: the location of the cluster's first Cloud
                          server.
                        pattern: ^[a-z0-9][a-z0-9-]{0,31}$
                        type: string
                      type:
                        description: Type of the Load Balancer, e.g. lb11 (the default).
                        pattern: ^[a-z0-9][a-z0-9-]{0,31}$
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              sso:
                description: |-
                  SSO is single sign-on through an OpenID Connect provider. The client
                  secret lives in the Secret kwerft-oidc-client (key "clientSecret") in
                  kwerft-system, which owners and admins may write through the console
                  but nobody reads back.
                properties:
                  allowedDomains:
                    description: |-
                      AllowedDomains, when set, admits only email addresses in these
                      domains. Auto-join requires it.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                  autoJoin:
                    description: |-
                      AutoJoin creates an account with DefaultRole for a verified address
                      in AllowedDomains on its first sign-in. Off: only existing members and
                      people with an open invite can sign in.
                    type: boolean
                  clientID:
                    description: ClientID of the console's OAuth client at the provider.
                    maxLength: 500
                    minLength: 1
                    type: string
                  defaultRole:
                    description: DefaultRole for auto-joined accounts.
                    enum:
                    - developer
                    - viewer
                    type: string
                  displayName:
                    description: DisplayName names the provider on the button ("Sign
                      in with …").
                    maxLength: 60
                    type: string
                  enabled:
                    description: Enabled shows the button on the sign-in page.
                    type: boolean
                  issuer:
                    description: |-
                      Issuer is the provider's issuer URL; discovery reads
                      <issuer>/.well-known/openid-configuration.
                    maxLength: 500
                    pattern: ^https://[^\s?#]+$
                    type: string
                  provider:
                    description: |-
                      Provider is the preset: google, microsoft (Entra ID, one tenant),
                      keycloak or oidc (any OpenID Connect provider).
                    enum:
                    - google
                    - microsoft
                    - keycloak
                    - oidc
                    type: string
                required:
                - clientID
                - enabled
                - issuer
                - provider
                type: object
              tls:
                default: http01
                description: TLS is how app certificates are issued.
                enum:
                - http01
                - dns01
                type: string
              updates:
                description: |-
                  Updates is how this console learns about and installs new releases
                  (docs/phase6-upgrades.md); management cluster only, for every cluster.
                properties:
                  channel:
                    default: stable
                    enum:
                    - stable
                    - edge
                    type: string
                  kubernetesPatches:
                    description: KubernetesPatches lets AutoPatch install k3s patch
                      versions too.
                    type: boolean
                  policy:
                    default: Notify
                    description: UpdatePolicy is what the console does about new releases.
                    enum:
                    - "Off"
                    - Notify
                    - AutoPatch
                    type: string
                  window:
                    description: MaintenanceWindow is when automatic upgrades may
                      start.
                    properties:
                      days:
                        description: 'Days of the week (Mon … Sun); empty: every day.'
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      duration:
                        type: string
                      start:
                        description: Start as HH:MM in TimeZone.
                        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                        type: string
                      timeZone:
                        description: TimeZone, an IANA name (default UTC).
                        type: string
                    required:
                    - start
                    type: object
                type: object
            type: object
          status:
            description: |-
              ConsoleSettingsStatus is written by the Domain reconciler, which owns the
              shared Gateway.
            properties:
              backups:
                description: Backups is the state of the backup target.
                properties:
                  checkedAt:
                    format: date-time
                    type: string
                  etcdSnapshots:
                    description: |-
                      EtcdSnapshots: per control-plane node, the last etcd snapshot the
                      node agent uploaded to the bucket (encrypted with the key derived
                      from the recovery key), as the agents report it. Empty while etcd
                      snapshots do not go to the bucket.
                    items:
                      description: EtcdSnapshotUpload is one node's etcd snapshot
                        uploads.
                      properties:
                        checkedAt:
                          description: |-
                            CheckedAt is when the agent last compared its snapshots with the
                            bucket.
                          format: date-time
                          type: string
                        message:
                          description: Message says what went wrong; empty when the
                            last pass succeeded.
                          type: string
                        name:
                          description: |-
                            Name of the newest snapshot in the bucket, e.g.
                            etcd-snapshot-server-1-1759665600.zip.
                          type: string
                        node:
                          description: |-
                            Node is the control-plane node whose local snapshots these are
                            (folder <prefix>/etcd/<node> in the bucket).
                          type: string
                        stored:
                          description: Stored is how many of this node's snapshots
                            the bucket holds.
                          format: int32
                          type: integer
                        uploadedAt:
                          description: UploadedAt is when the agent last finished
                            an upload.
                          format: date-time
                          type: string
                      type: object
                    type: array
                  lastSuccessfulAt:
                    format: date-time
                    type: string
                  message:
                    type: string
                  recoveryKeyCreatedAt:
                    description: |-
                      RecoveryKeyCreatedAt is when the recovery key (the repository
                      password) was made; it was shown once then.
                    format: date-time
                    type: string
                  state:
                    description: 'State: NotConfigured, Ready, Error.'
                    type: string
                type: object
              certificates:
                description: Certificates the console and the wildcard listener use.
                items:
                  description: CertificateState is one certificate the console itself
                    depends on.
                  properties:
                    hostnames:
                      description: Hostnames the certificate covers.
                      items:
                        type: string
                      type: array
                    message:
                      type: string
                    name:
                      description: Name of the cert-manager Certificate in kwerft-system.
                      type: string
                    notAfter:
                      format: date-time
                      type: string
                    purpose:
                      description: 'Purpose: console, console-next, console-previous
                        or apps-wildcard.'
                      type: string
                    ready:
                      description: Ready mirrors the Certificate's Ready condition.
                      type: boolean
                    reason:
                      type: string
                  required:
                  - hostnames
                  - name
                  - purpose
                  - ready
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consoleDomain:
                description: |-
                  ConsoleDomain is the hostname the console is served on now. While a
                  change waits for its certificate it still names the old hostname.
                type: string
              dns:
                description: |-
                  DNS is what the DNS reconciler did with spec.dns.manageRecords. It has
                  a field of its own because another reconciler writes the rest of the
                  status.
                properties:
                  message:
                    description: |-
                      Message explains a problem that kept the whole sync from running (no
                      token, token rejected, no public address); empty when it ran.
                    type: string
                  records:
                    description: Records Kwerft keeps, one entry per hostname.
                    items:
                      description: DNSRecordStatus is one hostname Kwerft keeps records
                        for.
                      properties:
                        hostname:
                          description: Hostname, e.g. ops.example.com or *.apps.example.com.
                          type: string
                        message:
                          type: string
                        project:
                          description: Project of the Domain, for purpose app.
                          type: string
                        purpose:
                          description: |-
                            Purpose: console, console-next, console-previous, apps, or app (a
                            remote cluster's hostname under the apps domain).
                          type: string
                        state:
                          description: State of the hostname's records.
                          enum:
                          - Managed
                          - External
                          - Conflict
                          - TakenOver
                          - NoZone
                          - Error
                          - Pending
                          - Unsupported
                          type: string
                        values:
                          description: Values the hostname's A and AAAA records hold
                            now.
                          items:
                            type: string
                          type: array
                        zone:
                          description: Zone that contains the hostname; empty for
                            NoZone.
                          type: string
                      required:
                      - hostname
                      - purpose
                      - state
                      type: object
                    type: array
                  syncedAt:
                    description: SyncedAt is when the provider was last read.
                    format: date-time
                    type: string
                  zones:
                    description: |-
                      Zones are the primary zones in the token's project: hostnames in them
                      get their records from Kwerft, so the console need not wait for DNS
                      before using them.
                    items:
                      type: string
                    type: array
                type: object
              hetznerCloud:
                description: |-
                  HetznerCloud is what the Hetzner Cloud reconciler found and did (the
                  Cloud Firewall, the Load Balancer). A field of its own, like DNS.
                properties:
                  firewall:
                    description: Firewall is the Cloud Firewall sync.
                    properties:
                      id:
                        format: int64
                        type: integer
                      message:
                        type: string
                      name:
                        type: string
                      revision:
                        description: Revision of the FirewallRules it carries (the
                          confirmed one).
                        type: string
                      rules:
                        description: Rules in the Cloud Firewall.
                        format: int32
                        type: integer
                      servers:
                        description: Servers it is applied to.
                        format: int32
                        type: integer
                      state:
                        description: 'State: InSync, Applying, Off, Error.'
                        type: string
                    required:
                    - state
                    type: object
                  loadBalancer:
                    description: LoadBalancer is the Load Balancer in front of the
                      ingress.
                    properties:
                      active:
                        description: 'Active: DNS points at the Load Balancer (status.publicAddresses).'
                        type: boolean
                      drainingSince:
                        description: DrainingSince is when it was turned off; it is
                          deleted DNS TTLs later.
                        format: date-time
                        type: string
                      healthyTargets:
                        format: int32
                        type: integer
                      id:
                        format: int64
                        type: integer
                      ipv4:
                        type: string
                      ipv6:
                        type: string
                      location:
                        type: string
                      message:
                        type: string
                      name:
                        type: string
                      state:
                        description: |-
                          State: Creating, Waiting (no healthy target yet), Active, Draining
                          (turned off; deleted once DNS moved back), Error.
                        type: string
                      targets:
                        description: |-
                          Targets the Load Balancer forwards to, and how many of them pass the
                          health checks on 443.
                        format: int32
                        type: integer
                      type:
                        type: string
                    required:
                    - state
                    type: object
                  message:
                    description: |-
                      Message explains a problem that kept the whole sync from running (no
                      token, token rejected); empty when it ran.
                    type: string
                  servers:
                    description: Servers are this cluster's nodes found in the token's
                      project.
                    items:
                      description: CloudServerStatus is one node that is a Hetzner
                        Cloud server.
                      properties:
                        id:
                          format: int64
                          type: integer
                        labelled:
                          description: |-
                            Labelled: the server carries kwerft.dev/cluster=<this cluster> (Kwerft
                            created it); others (the installer's first server) are named one by
                            one in the firewall and the Load Balancer.
                          type: boolean
                        location:
                          type: string
                        name:
                          type: string
                        node:
                          type: string
                      required:
                      - id
                      - name
                      - node
                      type: object
                    type: array
                  syncedAt:
                    description: SyncedAt is when the Cloud API was last read.
                    format: date-time
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              previousConsoleDomain:
                description: |-
                  PreviousConsoleDomain redirects to ConsoleDomain for a day after a
                  switch, so open tabs and bookmarks find the new name.
                type: string
              publicAddresses:
                description: |-
                  PublicAddresses are the nodes' external IPs: where DNS records for the
                  console and apps must point.
                items:
                  type: string
                type: array
              switchedAt:
                format: date-time
                type: string
              updates:
                description: Updates is what release discovery found (docs/phase6-upgrades.md).
                properties:
                  autoPatchPausedBy:
                    description: |-
                      AutoPatchPausedBy names the auto-update that failed or rolled back;
                      AutoPatch waits until an owner resumes it.
                    type: string
                  available:
                    items:
                      description: AvailableUpdate is one release the console could
                        upgrade to.
                      properties:
                        allowed:
                          description: 'Allowed: preflight-free rules (order, upgradeFrom,
                            supported k3s).'
                          type: boolean
                        component:
                          description: UpgradeComponent is what an Upgrade moves to
                            a new version.
                          enum:
                          - Kwerft
                          - Kubernetes
                          type: string
                        kind:
                          description: 'Kind: Patch or Minor.'
                          type: string
                        notes:
                          type: string
                        reason:
                          type: string
                        version:
                          type: string
                      required:
                      - allowed
                      - component
                      - kind
                      - version
                      type: object
                    type: array
                  checkedAt:
                    format: date-time
                    type: string
                  current:
                    description: UpgradeVersions are the running versions before an
                      Upgrade.
                    properties:
                      kubernetes:
                        type: string
                      kwerft:
                        type: string
                    type: object
                  error:
                    type: string
                type: object
              wildcardDomain:
                description: |-
                  WildcardDomain is "*.<appsDomain>" once the wildcard listener serves
                  apps (its certificate is issued); empty otherwise.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: the console settings object must be named kwerft
          rule: self.metadata.name == 'kwerft'
        - message: tls dns01 needs appsDomain and dns
          rule: '!has(self.spec) || !has(self.spec.tls) || self.spec.tls != ''dns01''
            || (has(self.spec.appsDomain) && size(self.spec.appsDomain) > 0 && has(self.spec.dns))'
    served: true
    storage: true
    subresources:
      status: {}
