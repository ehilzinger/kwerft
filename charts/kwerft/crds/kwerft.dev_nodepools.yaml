---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nodepools.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
    - pool
    singular: nodepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.serverType
      name: Type
      type: string
    - jsonPath: .spec.count
      name: Count
      type: integer
    - jsonPath: .status.readyNodes
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodePool keeps Count Hetzner Cloud servers joined to a cluster. Lives in
          the management cluster; cluster-scoped; owners and admins.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodePoolSpec is a group of Hetzner Cloud servers Kwerft keeps as nodes of
              one cluster.
            properties:
              cluster:
                description: Cluster the nodes join ("local" for the management cluster).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: cluster cannot be changed
                  rule: self == oldSelf
              count:
                description: |-
                  Count of servers. For role builds it is the maximum; the pool scales
                  to zero when no build has run for ScaleDownAfter.
                format: int32
                maximum: 50
                minimum: 0
                type: integer
              labels:
                additionalProperties:
                  type: string
                description: Labels put on the pool's Kubernetes nodes.
                type: object
              location:
                description: Location, e.g. fsn1; must be in the cluster's network
                  zone.
                minLength: 1
                type: string
              role:
                default: worker
                description: NodeRole is what a pool's nodes do.
                enum:
                - worker
                - control-plane
                - builds
                type: string
              scaleDownAfter:
                type: string
              serverType:
                description: ServerType, e.g. cx32. Changing it replaces nodes one
                  at a time.
                minLength: 1
                type: string
            required:
            - cluster
            - count
            - location
            - serverType
            type: object
          status:
            description: NodePoolStatus is written by the node pool reconciler.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodes:
                items:
                  description: PoolNode is one server of a NodePool.
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: 'Phase: Creating, Joining, Ready, Draining, Deleting,
                        Failed.'
                      type: string
                    privateIP:
                      type: string
                    publicIP:
                      type: string
                    serverID:
                      format: int64
                      type: integer
                  required:
                  - name
                  - phase
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              readyNodes:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
