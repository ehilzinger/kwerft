---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodes
      name: Nodes
      type: integer
    - jsonPath: .status.kubernetesVersion
      name: Version
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is a Kubernetes cluster managed from this console. It lives in
          the management cluster (where the console runs), which is itself the
          Cluster "local". Cluster-scoped; owners and admins manage clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec is one Kubernetes cluster the console manages.
            properties:
              appsDomain:
                description: |-
                  ConsoleDomain the cluster's own ingress serves apps under is set in
                  that cluster (ConsoleSettings there); this cluster's apps domain, if
                  different, is shown for reference.
                type: string
              displayName:
                type: string
              hetznerCloud:
                description: HetznerClusterSpec is how Kwerft creates a cluster on
                  Hetzner Cloud.
                properties:
                  controlPlanes:
                    default: 1
                    description: 'ControlPlanes: 1, or 3 for a highly available control
                      plane.'
                    enum:
                    - 1
                    - 3
                    format: int32
                    type: integer
                  firewall:
                    description: |-
                      Firewall: sync (default) or off — the cluster's Hetzner Cloud
                      Firewall, kept by Kwerft in that cluster as Settings › Hetzner Cloud
                      does for the console's own.
                    enum:
                    - sync
                    - "off"
                    type: string
                  loadBalancer:
                    description: |-
                      LoadBalancer puts a Hetzner Load Balancer in front of the cluster's
                      ingress.
                    properties:
                      enabled:
                        type: boolean
                      location:
                        description: |-
                          Location, e.g. fsn1; empty: the location of the cluster's first Cloud
                          server.
                        pattern: ^[a-z0-9][a-z0-9-]{0,31}$
                        type: string
                      type:
                        description: Type of the Load Balancer, e.g. lb11 (the default).
                        pattern: ^[a-z0-9][a-z0-9-]{0,31}$
                        type: string
                    required:
                    - enabled
                    type: object
                  location:
                    description: Location, e.g. fsn1, nbg1, hel1.
                    minLength: 1
                    type: string
                  serverType:
                    description: ServerType of the control-plane servers, e.g. cx22.
                    minLength: 1
                    type: string
                required:
                - location
                - serverType
                type: object
              provider:
                description: ClusterProvider says where a cluster came from.
                enum:
                - local
                - hetzner-cloud
                - adopted
                type: string
                x-kubernetes-validations:
                - message: provider cannot be changed
                  rule: self == oldSelf
            required:
            - provider
            type: object
            x-kubernetes-validations:
            - message: a hetzner-cloud cluster needs hetznerCloud
              rule: self.provider != 'hetzner-cloud' || has(self.hetznerCloud)
          status:
            description: ClusterStatus is written by the cluster reconciler and the
              agent tunnel.
            properties:
              agentVersion:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hetznerCloud:
                description: |-
                  HetznerCloud is what the cluster's own Hetzner Cloud reconciler last
                  reported (its Cloud Firewall and Load Balancer); hetzner-cloud
                  clusters only, copied through the agent's tunnel.
                properties:
                  firewall:
                    description: Firewall is the Cloud Firewall sync.
                    properties:
                      id:
                        format: int64
                        type: integer
                      message:
                        type: string
                      name:
                        type: string
                      revision:
                        description: Revision of the FirewallRules it carries (the
                          confirmed one).
                        type: string
                      rules:
                        description: Rules in the Cloud Firewall.
                        format: int32
                        type: integer
                      servers:
                        description: Servers it is applied to.
                        format: int32
                        type: integer
                      state:
                        description: 'State: InSync, Applying, Off, Error.'
                        type: string
                    required:
                    - state
                    type: object
                  loadBalancer:
                    description: LoadBalancer is the Load Balancer in front of the
                      ingress.
                    properties:
                      active:
                        description: 'Active: DNS points at the Load Balancer (status.publicAddresses).'
                        type: boolean
                      drainingSince:
                        description: DrainingSince is when it was turned off; it is
                          deleted DNS TTLs later.
                        format: date-time
                        type: string
                      healthyTargets:
                        format: int32
                        type: integer
                      id:
                        format: int64
                        type: integer
                      ipv4:
                        type: string
                      ipv6:
                        type: string
                      location:
                        type: string
                      message:
                        type: string
                      name:
                        type: string
                      state:
                        description: |-
                          State: Creating, Waiting (no healthy target yet), Active, Draining
                          (turned off; deleted once DNS moved back), Error.
                        type: string
                      targets:
                        description: |-
                          Targets the Load Balancer forwards to, and how many of them pass the
                          health checks on 443.
                        format: int32
                        type: integer
                      type:
                        type: string
                    required:
                    - state
                    type: object
                  message:
                    description: |-
                      Message explains a problem that kept the whole sync from running (no
                      token, token rejected); empty when it ran.
                    type: string
                  servers:
                    description: Servers are this cluster's nodes found in the token's
                      project.
                    items:
                      description: CloudServerStatus is one node that is a Hetzner
                        Cloud server.
                      properties:
                        id:
                          format: int64
                          type: integer
                        labelled:
                          description: |-
                            Labelled: the server carries kwerft.dev/cluster=<this cluster> (Kwerft
                            created it); others (the installer's first server) are named one by
                            one in the firewall and the Load Balancer.
                          type: boolean
                        location:
                          type: string
                        name:
                          type: string
                        node:
                          type: string
                      required:
                      - id
                      - name
                      - node
                      type: object
                    type: array
                  syncedAt:
                    description: SyncedAt is when the Cloud API was last read.
                    format: date-time
                    type: string
                type: object
              kubernetesVersion:
                type: string
              lastSeen:
                description: LastSeen is when the agent last answered.
                format: date-time
                type: string
              nodes:
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ClusterPhase is where a cluster stands.
                enum:
                - Pending
                - Provisioning
                - Connected
                - Disconnected
                - Failed
                type: string
              readyNodes:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
