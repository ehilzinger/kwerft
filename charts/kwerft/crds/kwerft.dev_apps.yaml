---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: apps.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: App
    listKind: AppList
    plural: apps
    singular: app
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.image
      name: Image
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.revision
      name: Revision
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          App is a deployable workload: an image or a Git repository plus how to run
          and expose it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppSpec is everything the deploy wizard collects.
            properties:
              allowFrom:
                description: |-
                  AllowFrom lists apps ("api" or "project/api") that may connect to this
                  app. Everything else is denied. Gateway traffic to public ports is
                  always allowed.
                items:
                  type: string
                type: array
              command:
                description: |-
                  Command replaces the image's entrypoint, one argument per item:
                  ["sh", "-c", "echo hi"], not ["sh -c echo hi"].
                items:
                  type: string
                type: array
                x-kubernetes-validations:
                - message: the program (first item) contains whitespace; give each
                    argument its own item, e.g. ["echo", "hi"], or use ["sh", "-c",
                    "..."]
                  rule: size(self) == 0 || !self[0].matches('[[:space:]]')
              drainSeconds:
                default: 5
                description: |-
                  DrainSeconds is how long a replica that is being stopped (rollout,
                  restart, scale-down) keeps running before it gets SIGTERM, so Services
                  and callers stop sending it new requests while it still answers. The
                  app then has 30 seconds to exit. 0 stops it at once. Only Apps with
                  ports drain; nothing routes to the others.
                format: int32
                maximum: 300
                minimum: 0
                type: integer
              egress:
                default: https
                description: Egress controls outbound traffic to the internet.
                enum:
                - none
                - https
                - all
                type: string
              env:
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              healthCheck:
                description: HealthCheck is used for readiness and liveness.
                properties:
                  http:
                    description: HTTP path; empty means a TCP check on Port.
                    type: string
                  port:
                    format: int32
                    type: integer
                required:
                - port
                type: object
              ports:
                items:
                  description: |-
                    AppPort exposes a container port inside the cluster and optionally on a
                    public hostname through the Gateway.
                  properties:
                    container:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: TCP
                      description: Protocol defines network protocols supported for
                        things like container ports.
                      enum:
                      - TCP
                      - UDP
                      type: string
                    public:
                      description: |-
                        Public is a hostname served over HTTPS, e.g. api.example.com. For a
                        second hostname, list the same container port again with it.
                      type: string
                  required:
                  - container
                  type: object
                type: array
              replicas:
                default: 1
                format: int32
                minimum: 0
                type: integer
              resources:
                description: ResourceRequirements describes the compute resource requirements.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              size:
                default: small
                description: Size is a preset for requests and limits; custom uses
                  Resources.
                enum:
                - small
                - medium
                - large
                - custom
                type: string
              source:
                description: |-
                  AppSource says where the container image comes from. Exactly one of Image
                  or Git is set.
                properties:
                  git:
                    description: GitSource builds the image in-cluster from a Git
                      repository.
                    properties:
                      autoDeploy:
                        default: true
                        description: AutoDeploy builds and deploys every push to Branch.
                        type: boolean
                      branch:
                        default: main
                        description: Branch to build and, with AutoDeploy, to follow.
                        type: string
                      builder:
                        default: dockerfile
                        description: Builder selects how the image is built.
                        enum:
                        - dockerfile
                        - railpack
                        type: string
                      connection:
                        description: |-
                          Connection names the GitConnection (GitHub App, GitLab, deploy key, ...)
                          that grants access to the repository. Empty for public repositories.
                        type: string
                      dockerfile:
                        default: Dockerfile
                        description: Dockerfile path relative to Path, when Builder
                          is dockerfile.
                        type: string
                      path:
                        default: /
                        description: Path is the build context inside the repository.
                        type: string
                      pinnedImage:
                        description: |-
                          PinnedImage runs this image (an earlier build) instead of the latest
                          successful build. The console sets it on rollback; clear it to follow
                          builds again.
                        type: string
                      repository:
                        description: Repository URL, e.g. https://github.com/acme/api.git
                          or git@host:acme/api.git.
                        minLength: 1
                        type: string
                    required:
                    - repository
                    type: object
                  image:
                    description: ImageSource deploys an existing image from any registry.
                    properties:
                      pullSecret:
                        description: PullSecret names a registry credential Secret
                          in the app's namespace.
                        type: string
                      ref:
                        description: Ref is a full image reference, e.g. ghcr.io/acme/api:1.42.0.
                        minLength: 1
                        type: string
                    required:
                    - ref
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of image or git
                  rule: has(self.image) != has(self.git)
              volumes:
                items:
                  description: |-
                    AppVolume mounts storage at Path, in one of three forms:
                      - Size (and Class): every replica gets its own disk; the App runs as a
                        StatefulSet so each replica keeps it.
                      - Volume: the shared Volume of that name in the same project, which
                        other Apps and Tasks can mount too.
                      - Secret: the Secret of that name in the same namespace, read-only, one
                        file per key (an SSH key, a certificate). Until the Secret exists the
                        pods wait in ContainerCreating, as Kubernetes does.
                  properties:
                    class:
                      description: |-
                        Class is local-nvme (fastest, pinned to one node) or hcloud-volume
                        (movable between Hetzner Cloud nodes); empty means local-nvme.
                      enum:
                      - local-nvme
                      - hcloud-volume
                      type: string
                    mode:
                      description: |-
                        Mode is the permission of the Secret's files, as a number: 256 is
                        0400. Empty means 0444: the files belong to root, so a container that
                        runs as another user (uid 1000) needs them world-readable, and ssh
                        accepts such a key because it only checks keys its own user owns. A
                        container that runs as root and hands the file to ssh needs 0400.
                      format: int32
                      maximum: 511
                      minimum: 0
                      type: integer
                    path:
                      minLength: 1
                      type: string
                    readOnly:
                      description: ReadOnly mounts the storage read-only. Secrets
                        always are.
                      type: boolean
                    secret:
                      description: |-
                        Secret names a Secret in the same namespace whose keys become files
                        under Path. It is always mounted read-only.
                      maxLength: 253
                      minLength: 1
                      type: string
                    size:
                      anyOf:
                      - type: integer
                      - type: string
                      description: Size of each replica's own disk.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    volume:
                      description: Volume names a shared Volume in the same project.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - path
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of size (a disk per replica), volume
                      (a shared Volume) or secret (a Secret as files)
                    rule: '(has(self.size) ? 1 : 0) + (has(self.volume) ? 1 : 0) +
                      (has(self.secret) ? 1 : 0) == 1'
                  - message: class applies to size; a shared Volume has its own class
                    rule: '!has(self.class) || has(self.size)'
                  - message: mode applies to secret (the permission of its files)
                    rule: '!has(self.mode) || has(self.secret)'
                type: array
            required:
            - source
            type: object
          status:
            description: AppStatus is written by the App reconciler.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              history:
                description: History holds the most recent revisions, newest first.
                items:
                  description: AppRevision records one rollout for history and rollback.
                  properties:
                    build:
                      description: Build that produced Image, for Git apps.
                      type: string
                    commit:
                      description: Commit Image was built from, for Git apps.
                      type: string
                    generation:
                      description: Generation is the App spec generation this revision
                        rolled out.
                      format: int64
                      type: integer
                    image:
                      type: string
                    number:
                      format: int64
                      type: integer
                    time:
                      format: date-time
                      type: string
                  required:
                  - generation
                  - image
                  - number
                  - time
                  type: object
                maxItems: 20
                type: array
              image:
                description: Image is the fully resolved image currently rolled out.
                type: string
              observedGeneration:
                format: int64
                type: integer
              readyReplicas:
                format: int32
                type: integer
              revision:
                format: int64
                type: integer
              urls:
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.readyReplicas
      status: {}
