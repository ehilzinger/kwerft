apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "werft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "werft.labels" . | nindent 4 }}
spec:
  # TODO(phase-1): replicas > 1 needs leader election for the reconcilers and
  # the SQLite store moved behind the leader (or to Postgres for HA).
  replicas: 1
  strategy:
    type: Recreate             # single RWO volume for SQLite
  selector:
    matchLabels: {{- include "werft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "werft.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "werft.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: werft
          image: {{ include "werft.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:8080
            - --data-dir=/var/lib/werft
            - --console-domain={{ required "console.domain is required" .Values.console.domain }}
            - --platform={{ .Values.platform }}
            - --gateway-class={{ .Values.gateway.className }}
            - --cluster-issuer={{ if .Values.acme.enabled }}letsencrypt{{ end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/werft
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "werft.fullname" . }}-data
        - name: tmp
          emptyDir: {}
