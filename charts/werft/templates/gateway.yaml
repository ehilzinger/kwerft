{{- if .Values.gateway.create }}
# Listeners for app domains are added by the Domain reconciler at runtime;
# Helm only owns the console listeners below.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "werft.labels" . | nindent 4 }}
  {{- if .Values.acme.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
    - name: console-https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.console.domain | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: werft-console-tls
      allowedRoutes:
        namespaces: { from: Same }
{{- end }}
