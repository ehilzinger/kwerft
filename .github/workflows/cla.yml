# The contributor license agreement check (CLA.md): every author of a pull
# request's commits must have signed, by commenting the exact sentence from
# CLA.md › "How to sign" on a pull request. Signatures are kept in
# signatures/cla-v1.json on the branch cla-signatures (never on main), one
# entry per GitHub account: login, numeric ID, date, CLA version and the
# comment that signed.
#
# pull_request_target and issue_comment run with this repository's token so
# a pull request from a fork can be checked and signed. Safe because the
# workflow never checks out or runs the pull request's code: it reads the
# commits' authors and comments through the API only.
name: cla

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write       # signatures on the cla-signatures branch
  pull-requests: write  # the comment that asks to sign
  issues: read
  statuses: write       # the "cla" commit status

concurrency:
  group: cla-signatures  # one writer of the signatures file at a time
  cancel-in-progress: false

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const CLA_VERSION = "1.0";
            const PHRASE = "I have read the Kwerft CLA and I agree to it.";
            const BRANCH = "cla-signatures";
            const FILE = "signatures/cla-v1.json";
            const MARKER = "<!-- kwerft-cla -->";
            const ALLOW = new Set(["ehilzinger"]); // the maintainer
            const { owner, repo } = context.repo;
            const claURL = `https://github.com/${owner}/${repo}/blob/main/CLA.md`;
            const norm = (s) => (s || "").trim().replace(/\s+/g, " ").replace(/^>\s*/, "").toLowerCase();

            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open") return;

            // Signatures: the file on the cla-signatures branch, created on first use.
            async function readSignatures() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH });
                return { list: JSON.parse(Buffer.from(data.content, "base64").toString("utf8")), sha: data.sha };
              } catch (e) {
                if (e.status !== 404) throw e;
                return { list: [], sha: undefined };
              }
            }
            async function ensureBranch() {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${BRANCH}` });
              } catch (e) {
                if (e.status !== 404) throw e;
                // An orphan branch with only the signatures file: nothing of main in it.
                const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: "[]\n", encoding: "utf-8" });
                const { data: tree } = await github.rest.git.createTree({ owner, repo, tree: [{ path: FILE, mode: "100644", type: "blob", sha: blob.sha }] });
                const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: "CLA signatures", tree: tree.sha, parents: [] });
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: commit.sha });
              }
            }

            // Who must sign: every commit author, by GitHub account.
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
            const authors = new Map();   // id → login
            const unlinked = [];         // commits whose author is no GitHub account
            for (const c of commits) {
              const a = c.author;
              if (!a) { unlinked.push(c.sha.slice(0, 7)); continue; }
              if (a.type === "Bot" || a.login.endsWith("[bot]") || ALLOW.has(a.login)) continue;
              authors.set(a.id, a.login);
            }

            let { list, sha } = await readSignatures();

            // A signing comment by one of the authors is recorded.
            if (context.eventName === "issue_comment") {
              const comment = context.payload.comment;
              const user = comment.user;
              if (norm(comment.body) !== norm(PHRASE)) return;
              if (!authors.has(user.id)) {
                core.info(`${user.login} commented the sentence but authored no commit of #${number}; not recorded.`);
              } else if (!list.some((s) => s.id === user.id)) {
                await ensureBranch();
                ({ list, sha } = await readSignatures());
                list.push({ login: user.login, id: user.id, version: CLA_VERSION, signedAt: comment.created_at,
                  pullRequest: number, comment: comment.html_url });
                await github.rest.repos.createOrUpdateFileContents({ owner, repo, branch: BRANCH, path: FILE, sha,
                  message: `CLA ${CLA_VERSION} signed by @${user.login} (#${number})`,
                  content: Buffer.from(JSON.stringify(list, null, 2) + "\n").toString("base64") });
              }
            }

            const signed = new Set(list.map((s) => s.id));
            const missing = [...authors].filter(([id]) => !signed.has(id)).map(([, login]) => login);
            const ok = missing.length === 0 && unlinked.length === 0;

            await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha, context: "cla",
              state: ok ? "success" : "failure", target_url: claURL,
              description: ok ? "Every author signed the CLA" : missing.length ? `Not signed yet: ${missing.join(", ")}` : "Commits without a GitHub account" });

            // One comment per pull request, kept up to date.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.includes(MARKER));
            let body;
            if (ok) {
              if (!mine) return; // nothing was ever asked
              body = `${MARKER}\nEvery author of this pull request has signed the [contributor license agreement](${claURL}). Thank you!`;
            } else {
              body = `${MARKER}\nThank you for your pull request. Kwerft is offered under the AGPL and a commercial license, so every contributor signs a [contributor license agreement](${claURL}) once (you keep your copyright).\n\n`;
              if (missing.length) {
                body += `Not signed yet: ${missing.map((l) => "@" + l).join(", ")}. Please read the agreement, then reply to this pull request with:\n\n> ${PHRASE}\n`;
              }
              if (unlinked.length) {
                body += `\nSome commits (${unlinked.join(", ")}) have an author email that belongs to no GitHub account, so their author cannot sign. Set your Git email to one of your GitHub account's addresses and amend those commits.\n`;
              }
            }
            if (mine) {
              if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
