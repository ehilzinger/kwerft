# Cuts a release from a tag: v0.2.0 (stable) or v0.2.0-rc.1 (prerelease).
# Run it by hand (workflow_dispatch) to rehearse: everything is built and
# summarised, nothing is published. See RELEASING.md.
#
# The steps themselves live in hack/release.sh, so `make release-dry-run`
# exercises the same code on a laptop.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse; nothing is published (e.g. 0.2.0-rc.1)
        required: true
        default: 0.0.0-dryrun

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # Builds everything (stamped scripts, chart, per-platform images, SBOMs) and,
  # for tag pushes only, publishes image and chart to GHCR and creates the
  # GitHub Release. One job on purpose: handing build output to a separate
  # publish job needs workflow artifacts, which count against the account's
  # storage quota for private repositories — a full quota failed v0.1.0-rc.1.
  # Manual runs (workflow_dispatch) build and summarise, but publish nothing.
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub Release (tag pushes only)
      packages: write   # ghcr.io/ehilzinger/kwerft and ghcr.io/ehilzinger/charts/kwerft
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.image.outputs.ref }}
      chart: ${{ steps.chart.outputs.ref }}
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every release tag: upgradeFrom's default and crdcompat's baselines
      # checkout can leave the pushed tag as a lightweight copy; the annotated
      # tag's message carries the trailers (Upgrade-From, Rollback-Safe).
      - name: Fetch the annotated tag
        if: github.event_name == 'push'
        run: git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - id: meta
        env:
          REF: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: hack/release.sh meta "$REF" | tee -a "$GITHUB_OUTPUT"
      - id: pins
        run: sed -n -E 's/^(HELM_VERSION)="([^"]*)".*/\1=\2/p' install/install.sh | tee -a "$GITHUB_OUTPUT"
      - id: trailers
        name: Upgrade path (tag trailers or defaults)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: hack/release.sh trailers "$VERSION" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Before anything is built or published: CRDs are never rolled back, so
      # they must stay compatible with the releases a rollback lands on.
      - name: CRDs compatible with the previous releases
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: hack/release.sh crdcompat "$VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.pins.outputs.HELM_VERSION }}
      - run: make web
      - run: hack/release.sh dry-run "$VERSION" dist/release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - run: |
          {
            cat dist/release/NOTES.md
            printf '<details><summary>manifest.json (draft: the digests come with the push)</summary>\n\n```json\n'
            cat dist/release/manifest.json
            printf '```\n\n</details>\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Helm in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - id: image
        name: Push the image (linux/amd64 + linux/arm64)
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: echo "ref=$(hack/release.sh push-image "$VERSION" dist/release)" >>"$GITHUB_OUTPUT"
      - id: chart
        name: Push the chart
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: echo "ref=$(hack/release.sh push-chart "$VERSION" dist/release)" >>"$GITHUB_OUTPUT"
      # The final manifest, with the digests just pushed. It travels to the
      # install-repo job as a release asset, like the stamped scripts.
      - name: Write manifest.json
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: hack/release.sh manifest "$VERSION" dist/release
      - name: Create the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          IMAGE: ${{ steps.image.outputs.ref }}
          CHART: ${{ steps.chart.outputs.ref }}
          UPGRADE_FROM: ${{ steps.trailers.outputs.upgrade_from }}
          ROLLBACK_SAFE: ${{ steps.trailers.outputs.rollback_safe }}
          CHANNEL: ${{ steps.trailers.outputs.channel }}
        run: |
          hack/release.sh notes "$VERSION" dist/release >dist/release/NOTES.md
          assets=(dist/release/install.sh dist/release/join.sh dist/release/SHA256SUMS dist/release/manifest.json
                  "dist/release/kwerft-$VERSION.tgz" dist/release/sbom/*.spdx.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run of this workflow: refresh the files, keep the notes.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=(--title "Kwerft $TAG" --notes-file dist/release/NOTES.md --generate-notes --verify-tag)
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" "${flags[@]}" "${assets[@]}"
          fi
          {
            echo "Released $TAG"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Chart: \`$CHART\`"
            echo "- Upgrades from: $UPGRADE_FROM · rollback-safe: $ROLLBACK_SAFE · channel: $CHANNEL"
          } >>"$GITHUB_STEP_SUMMARY"

  # Opt-in (repository variable SIGN_RELEASES=true): keyless cosign signatures.
  # Keyless signing records this repository's name, the workflow path and the
  # commit in the public Rekor transparency log; see RELEASING.md.
  sign:
    needs: release
    if: github.event_name == 'push' && vars.SIGN_RELEASES == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the OIDC token Fulcio turns into a signing certificate
      packages: write   # signatures are stored next to the image and chart
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.release.outputs.image }}
          CHART: ${{ needs.release.outputs.chart }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign sign --yes "$CHART"

  # The install script is served from a separate public repository because this
  # one is private. Needs the INSTALL_REPO_TOKEN secret; skipped without it.
  install-repo:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      INSTALL_REPO: ${{ vars.INSTALL_REPO || 'ehilzinger/kwerft-install' }}
      HAS_TOKEN: ${{ secrets.INSTALL_REPO_TOKEN != '' }}
    steps:
      - name: Skip without INSTALL_REPO_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice title=Install repository not updated::The INSTALL_REPO_TOKEN secret is not set, so $INSTALL_REPO was not updated with v$VERSION. The stamped scripts are attached to the GitHub Release. One-time setup: RELEASING.md."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: ${{ env.INSTALL_REPO }}
          token: ${{ secrets.INSTALL_REPO_TOKEN }}
          path: install-repo
      # The stamped scripts and manifest.json exactly as attached to the
      # GitHub Release, and its notes (consoles read them from here).
      - name: Fetch the stamped scripts, manifest and notes from the release
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern install.sh --pattern join.sh --pattern SHA256SUMS \
            --pattern manifest.json --dir dist/release
          gh release view "$TAG" --json body --jq .body >dist/release/NOTES.md
      - name: Publish the stamped scripts, manifest.json, NOTES.md and releases.json
        if: env.HAS_TOKEN == 'true'
        run: |
          git -C install-repo config user.name "github-actions[bot]"
          git -C install-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          hack/release.sh install-repo install-repo "$VERSION" dist/release
          git -C install-repo push origin HEAD:main
          {
            echo "Install script: https://raw.githubusercontent.com/$INSTALL_REPO/main/v$VERSION/install.sh"
            echo
            echo "Manifest: https://raw.githubusercontent.com/$INSTALL_REPO/main/v$VERSION/manifest.json"
          } >>"$GITHUB_STEP_SUMMARY"

  # The published release on fresh Hetzner Cloud servers: a fresh install and
  # an upgrade from the stable release before it (e2e.yml, RELEASING.md).
  # Runs after everything is published; a failure does not unpublish the
  # release, and the run summary says so. Skipped with a notice without the
  # HCLOUD_TOKEN secret.
  e2e:
    needs: [release, install-repo]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.release.result == 'success' }}
    permissions:
      contents: read   # lists releases to find the one to upgrade from
    uses: ./.github/workflows/e2e.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release: true
    secrets:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
