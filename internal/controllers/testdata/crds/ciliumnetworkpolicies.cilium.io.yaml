# Minimal stand-in for Cilium's CiliumNetworkPolicy CRD so tests can assert
# on the policies Kwerft renders without installing Cilium. Schema-less on
# purpose: the rendering tests check the structure (traffic_render_test.go).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
    shortNames: [cnp]
  scope: Namespaced
  versions:
    - name: v2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
