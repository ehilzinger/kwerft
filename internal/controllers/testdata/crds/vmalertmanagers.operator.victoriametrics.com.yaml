# Minimal stand-in for the VictoriaMetrics operator's VMAlertmanager CRD: the
# channel reconciler only reads spec.disableNamespaceMatcher. The VMRule and
# VMAlertmanagerConfig CRDs next to it are the operator's own (v0.75.0,
# victoria-metrics-k8s-stack 0.95.0 as pinned in install.sh, Apache-2.0), so
# tests catch fields the operator would reject.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmalertmanagers.operator.victoriametrics.com
spec:
  group: operator.victoriametrics.com
  names:
    kind: VMAlertmanager
    listKind: VMAlertmanagerList
    plural: vmalertmanagers
    singular: vmalertmanager
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
