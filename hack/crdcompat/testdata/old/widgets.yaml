# The previous release's CRD. compat_test.go patches a copy of it per case;
# ../new holds a release that changed it incompatibly.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kwerft.dev
spec:
  group: kwerft.dev
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
    shortNames: [wg]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 63
              color:
                type: string
              mode:
                type: string
                enum: [Fast, Slow]
              size:
                type: integer
                minimum: 1
                maximum: 10
              tags:
                type: array
                maxItems: 8
                items:
                  type: string
              labels:
                type: object
                additionalProperties:
                  type: string
              port:
                x-kubernetes-int-or-string: true
              limits:
                type: object
                properties:
                  cpu:
                    type: string
              rules:
                type: array
                items:
                  type: object
                  properties:
                    host:
                      type: string
                    path:
                      type: string
          status:
            type: object
            properties:
              phase:
                type: string
